<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Retinal Disease Detector</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 1.5rem; }
  #result { margin-top: 20px; white-space: pre-wrap; }
  img#preview { max-width: 100%; margin-top: 10px; border-radius: 8px; }
</style>
</head>
<body>
  <h1>Retinal Disease Detector</h1>
  <p>Upload a fundus retinal image to get a diabetic retinopathy severity grade.</p>
  <input type="file" id="fileInput" accept="image/*">
  <button id="analyzeBtn">Analyze</button>
  <div id="result"></div>
  <img id="preview" style="display:none;">

  <script>
    const btn = document.getElementById('analyzeBtn');
    const input = document.getElementById('fileInput');
    const result = document.getElementById('result');
    const preview = document.getElementById('preview');

    btn.addEventListener('click', async () => {
      if (!input.files.length) {
        result.textContent = 'Please choose an image first.';
        return;
      }
      const formData = new FormData();
      formData.append('file', input.files[0]);
      result.textContent = 'Analyzing...';

      try {
        const res = await fetch('/predict', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.error) {
          result.textContent = 'Error: ' + data.error;
          return;
        }
        result.textContent =
          `Grade ${data.grade}: ${data.full}\n` +
          `Confidence: ${data.confidence}%\n\n` +
          `${data.description}\n\n` +
          `Recommendation: ${data.recommendation}`;
        if (data.cam_image) {
          preview.src = data.cam_image;
          preview.style.display = 'block';
        }
      } catch (e) {
        result.textContent = 'Request failed: ' + e;
      }
    });
  </script>
</body>
</html>
